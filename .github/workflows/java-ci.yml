name: MATSim Java CI

on:
  push:
    branches: [ VIPVmain, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Revision (2026): compile the MATSim source and execute the focused
      # VIPV regression tests. Python optimization checks remain separate.
      - name: Verify Java project
        run: mvn --batch-mode --no-transfer-progress verify
