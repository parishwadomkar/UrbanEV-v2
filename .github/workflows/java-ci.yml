name: MATSim Java CI

on:
  push:
    branches: [ VIPVmain, master ]
  pull_request:
    branches: [ VIPVmain, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 11
            os: ubuntu-latest
            name: Java 11
          - java: 17
            os: ubuntu-latest
            name: Java 17
          - java: 11
            os: windows-latest
            name: Java 11 / Windows
          - java: 17
            os: windows-latest
            name: Java 17 / Windows
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify Java project
        run: mvn --batch-mode --no-transfer-progress clean verify
