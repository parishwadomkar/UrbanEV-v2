name: UrbanEV Opti CI

on:
  workflow_dispatch:
  push:
    branches: [VIPVmain, master]
    paths:
      - src/main/python/Opti/**
      - '!src/main/python/Opti/data/**'
      - '!src/main/python/Opti/runs/**'
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/main/python/Opti/**
      - '!src/main/python/Opti/data/**'
      - '!src/main/python/Opti/runs/**'
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: opti-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: src/main/python/Opti
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/main/python/Opti/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_dev.txt
      - name: Check source, configuration, and documentation links
        run: python scripts/check_repository.py
      - name: Lint Python correctness and unused code
        run: python -m flake8 src src_lbbd src_benders scripts tests --select=E9,F63,F7,F82,F401,F811,F841
      - name: Run synthetic regression tests
        run: python -m pytest -q tests
      - name: Check scenario command generation
        run: python scripts/run_matrix.py --dry-run
